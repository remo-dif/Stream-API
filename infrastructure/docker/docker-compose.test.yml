services:
  backend-test:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.test
    env_file:
      - path: ../../.env.test
        required: false
    environment:
      # Test services use isolated databases so CI cannot mutate dev/staging data.
      NODE_ENV: test
      SUPABASE_URL: ${SUPABASE_URL:-https://example-test.supabase.co}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-your-test-anon-key}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-your-test-service-role-key}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-test-placeholder}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-sk-ant-test-placeholder}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3-5-sonnet-20241022}
      REDIS_HOST: redis-test
      REDIS_PORT: 6379
      REDIS_URL: redis://redis-test:6379
    volumes:
      # Coverage is mounted out of the container for Jenkins report publishing.
      - ../../coverage:/app/coverage
      # jest-junit writes to ../coverage from /app, so this keeps junit.xml on the host too.
      - ../../coverage:/coverage
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy

  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stream_api_test
    tmpfs:
      # Test database is intentionally ephemeral for repeatable CI runs.
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-test:
    image: redis:7-alpine
    command: redis-server --save ""
    tmpfs:
      # Redis state is not needed after a test run.
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
