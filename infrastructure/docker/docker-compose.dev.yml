services:
  backend:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.dev
    ports:
      - "3000:3000"
    env_file:
      - path: ../../.env.dev
        required: false
    environment:
      # Keep service hostnames aligned with Compose networking.
      NODE_ENV: development
      SUPABASE_URL: ${SUPABASE_URL:-https://example-dev.supabase.co}
      SUPABASE_KEY: ${SUPABASE_KEY:-dev-supabase-key-placeholder}
      SUPABASE_ANON_KEY: ${SUPABASE_KEY:-dev-supabase-key-placeholder}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_KEY:-dev-supabase-key-placeholder}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-dev-anthropic-key-placeholder}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/stream_api_dev
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-placeholder}
    volumes:
      # Mount source only for fast NestJS hot reload; node_modules stays inside the image.
      - ../../src:/app/src
      - ../../test:/app/test
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      # Development uses simple local-only credentials.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stream_api_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_dev_data:
  redis_dev_data:
